<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal da Agência — ViagensLabs</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            labs: {
              blue:   '#0055ff',
              dark:   '#0f172a',
              gray:   '#f8fafc',
              border: '#e2e8f0',
              accent: '#3b82f6'
            }
          }
        }
      }
    }
  </script>
  <style>
    [v-cloak] { display: none !important; }
    body { background: #0f172a; font-family: 'Inter', sans-serif; }
    .bg-viagens {
      background-image: linear-gradient(135deg, rgba(15,23,42,0.92) 0%, rgba(0,55,180,0.80) 100%),
                        url('/img/bg-aviao.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .glass-card {
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.4);
    }
    .fade-enter-active, .fade-leave-active { transition: opacity .3s ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }
  </style>
</head>
<body class="font-sans antialiased selection:bg-labs-blue selection:text-white">
<div id="app" v-cloak class="min-h-full">

  <!-- ═══════════════════════════ TOKEN: CARREGANDO ════════════════ -->
  <div v-if="tela === 'token_carregando'" class="bg-viagens min-h-screen flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-sm p-8 text-center">
      <div class="animate-spin h-12 w-12 border-4 border-labs-blue border-t-transparent rounded-full mx-auto mb-4"></div>
      <p class="text-gray-600 text-sm">Carregando solicitação…</p>
    </div>
  </div>

  <!-- ═══════════════════════════ TOKEN: ERRO ══════════════════════ -->
  <div v-else-if="tela === 'token_erro'" class="bg-viagens min-h-screen flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-sm p-8 text-center">
      <div class="text-5xl mb-4">⛔</div>
      <h2 class="text-xl font-bold text-red-700 mb-2">Link inválido</h2>
      <p class="text-gray-600 text-sm mb-4">{{ tokenErro }}</p>
      <p class="text-xs text-gray-400">Entre em contato com o setor de viagens para solicitar um novo link.</p>
    </div>
  </div>

  <!-- ═══════════════════════════ APP PRINCIPAL ════════════════════ -->
  <div v-else class="bg-viagens min-h-screen">

    <!-- Navbar -->
    <nav class="bg-white/90 backdrop-blur-md shadow-sm border-b border-white/20 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 py-0 h-16 flex items-center justify-between">
        <div class="flex items-center gap-4">
          <img src="/img/luizalabs-logo.png" alt="Luizalabs" class="h-8 object-contain border-r border-gray-200 pr-4" onerror="this.style.display='none'">
          <div class="hidden sm:block">
            <h1 class="text-base font-bold text-labs-dark tracking-tight leading-tight">Portal da Agência</h1>
            <p class="text-xs text-gray-400 font-medium uppercase tracking-widest">Cotação e Vouchers</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="hidden sm:flex flex-col items-end">
            <span class="text-sm font-semibold text-gray-700">{{ agenciaNome }}</span>
            <span class="text-xs font-medium bg-blue-50 text-labs-blue px-2 py-0.5 rounded-md">Agência</span>
          </div>
          <div class="h-9 w-9 rounded-lg bg-labs-dark text-white flex items-center justify-center font-bold text-sm shadow-sm">
            {{ agenciaNome ? agenciaNome.charAt(0).toUpperCase() : 'A' }}
          </div>
        </div>
      </div>
    </nav>

    <!-- Conteúdo -->
    <main class="max-w-7xl mx-auto px-4 py-8">
      <!-- Wrapper com card branco para contrastar com o fundo -->
      <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-xl p-6 min-h-[70vh]">

      <!-- ─── LISTA ─── -->
      <template v-if="tela === 'lista'">
        <div class="flex items-center justify-between mb-6">
          <h1 class="text-xl font-bold text-gray-800">Solicitações para Cotação</h1>
          <div class="flex gap-2">
            <select v-model="filtroStatus" @change="carregarSolicitacoes"
              class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">Todos os status</option>
              <option value="AGUARDANDO_COTACAO">Aguardando Cotação</option>
              <option value="COTACAO_ENVIADA">Cotação Enviada</option>
              <option value="APROVADA_AGUARDANDO_VOUCHER">Aguardando Vouchers</option>
              <option value="CONCLUIDA">Concluída</option>
            </select>
            <button @click="carregarSolicitacoes"
              class="bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-lg px-4 py-2 transition">
              ↻ Atualizar
            </button>
          </div>
        </div>

        <div v-if="carregandoLista" class="text-center py-16 text-gray-400 text-sm">Carregando…</div>

        <div v-else-if="solicitacoes.length === 0" class="text-center py-16 text-gray-400 text-sm">
          Nenhuma solicitação encontrada.
        </div>

        <div v-else class="space-y-4">
          <div v-for="sol in solicitacoes" :key="sol.id"
            class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 hover:shadow-md transition cursor-pointer"
            @click="abrirDetalhe(sol.id)">

            <div class="flex items-start justify-between flex-wrap gap-2">
              <div>
                <span class="text-xs font-mono font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{{ sol.protocolo }}</span>
                <span :class="badgeStatus(sol.status)" class="ml-2 text-xs font-semibold rounded px-2 py-0.5">{{ labelStatus(sol.status) }}</span>
                <span v-if="sol.classificacao === 'Emergencial'" class="ml-2 text-xs font-semibold bg-red-100 text-red-700 rounded px-2 py-0.5">🚨 Emergencial</span>
              </div>
              <div class="text-xs text-gray-400">{{ formatarData(sol.data_ida) }}
                <template v-if="sol.data_volta"> → {{ formatarData(sol.data_volta) }}</template>
              </div>
            </div>

            <div class="mt-2 flex flex-wrap gap-x-6 gap-y-1 text-sm text-gray-700">
              <span><strong>Destino:</strong> {{ sol.destino_cidade }}<template v-if="sol.destino_estado">/{{ sol.destino_estado }}</template></span>
              <span><strong>Origem:</strong> {{ sol.origem_cidade || '—' }}</span>
              <span><strong>Serviços:</strong> {{ sol.tipo_servico }}</span>
            </div>

            <!-- Casamentos -->
            <div v-if="sol.casamentos && sol.casamentos.length" class="mt-2 flex flex-wrap gap-2">
              <span v-for="c in sol.casamentos" :key="c.par_id"
                :class="badgeCasamento(c.tipo_match)"
                class="text-xs rounded-full px-2 py-0.5 font-semibold">
                🔗 {{ c.tipo_match }} com #{{ c.par_id }}
              </span>
            </div>

            <!-- Cotação -->
            <div v-if="sol.cotacao" class="mt-2 text-xs text-green-600 font-semibold">
              ✔ Cotação enviada — Total: {{ formatarMoeda(sol.cotacao.valor_total) }}
            </div>
          </div>
        </div>
      </template>

      <!-- ─── DETALHE / COTAÇÃO ─── -->
      <template v-if="tela === 'detalhe'">
        <button v-if="!modoToken" @click="voltarLista" class="text-sm text-blue-600 hover:underline mb-6">← Voltar à lista</button>

        <div v-if="!solDetalhe" class="text-center py-16 text-gray-400 text-sm">Carregando…</div>

        <template v-else>
          <!-- ── Dados completos do Viajante ── -->
          <div v-if="solDetalhe.viajante_nome || solDetalhe.viajante_cpf" class="bg-sky-50 border border-sky-200 rounded-xl p-5 mb-5">
            <h3 class="text-sm font-bold text-sky-700 mb-3 flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              Dados do Viajante
            </h3>
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 text-xs">
              <div v-if="solDetalhe.viajante_nome" class="col-span-2 md:col-span-1">
                <span class="text-sky-500 block font-bold uppercase tracking-wide mb-0.5">Nome Completo</span>
                <span class="font-semibold text-gray-800">{{ solDetalhe.viajante_nome }}</span>
              </div>
              <div v-if="solDetalhe.viajante_data_nascimento">
                <span class="text-sky-500 block font-bold uppercase tracking-wide mb-0.5">Nascimento</span>
                <span class="text-gray-700">{{ solDetalhe.viajante_data_nascimento }}</span>
              </div>
              <div v-if="solDetalhe.viajante_cpf">
                <span class="text-sky-500 block font-bold uppercase tracking-wide mb-0.5">CPF</span>
                <span class="font-mono text-gray-700">{{ solDetalhe.viajante_cpf }}</span>
              </div>
              <div v-if="solDetalhe.viajante_celular">
                <span class="text-sky-500 block font-bold uppercase tracking-wide mb-0.5">Telefone</span>
                <span class="text-gray-700">{{ solDetalhe.viajante_celular }}</span>
              </div>
              <div v-if="solDetalhe.viajante_matricula">
                <span class="text-sky-500 block font-bold uppercase tracking-wide mb-0.5">Matrícula</span>
                <span class="font-mono text-gray-700">{{ solDetalhe.viajante_matricula }}</span>
              </div>
              <div v-if="solDetalhe.viajante_cargo">
                <span class="text-sky-500 block font-bold uppercase tracking-wide mb-0.5">Cargo</span>
                <span class="text-gray-700">{{ solDetalhe.viajante_cargo }}</span>
              </div>
              <div v-if="solDetalhe.viajante_centro_custo" class="col-span-2 md:col-span-1">
                <span class="text-sky-500 block font-bold uppercase tracking-wide mb-0.5">Centro de Custo</span>
                <span class="text-gray-700">{{ solDetalhe.viajante_centro_custo }}<span v-if="solDetalhe.viajante_cod_centro_custo" class="text-gray-400 ml-1 font-mono">({{ solDetalhe.viajante_cod_centro_custo }})</span></span>
              </div>
              <div v-if="solDetalhe.viajante_email" class="col-span-2">
                <span class="text-sky-500 block font-bold uppercase tracking-wide mb-0.5">E-mail</span>
                <span class="text-gray-700">{{ solDetalhe.viajante_email }}</span>
              </div>
            </div>
          </div>

          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">

            <!-- Cabeçalho -->
            <div class="flex items-center justify-between flex-wrap gap-2 mb-4">
              <div class="flex items-center gap-3">
                <span class="text-lg font-bold font-mono text-blue-700">{{ solDetalhe.protocolo }}</span>
                <span :class="badgeStatus(solDetalhe.status)" class="text-xs font-semibold rounded px-2 py-0.5">{{ labelStatus(solDetalhe.status) }}</span>
                <span v-if="solDetalhe.classificacao === 'Emergencial'" class="text-xs font-semibold bg-red-100 text-red-700 rounded px-2 py-0.5">🚨 Emergencial</span>
              </div>
            </div>

            <!-- Dados principais -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 text-sm">
              <div><span class="text-gray-500 text-xs">Solicitante</span><p class="font-medium">{{ solDetalhe.solicitante_username }}</p></div>
              <div><span class="text-gray-500 text-xs">Origem</span><p class="font-medium">{{ solDetalhe.origem_cidade || '—' }}</p></div>
              <div><span class="text-gray-500 text-xs">Destino</span><p class="font-medium">{{ solDetalhe.destino_cidade }}{{ solDetalhe.destino_estado ? '/' + solDetalhe.destino_estado : '' }}</p></div>
              <div><span class="text-gray-500 text-xs">Data de Ida</span><p class="font-medium">{{ formatarData(solDetalhe.data_ida) }}</p></div>
              <div><span class="text-gray-500 text-xs">Data de Volta</span><p class="font-medium">{{ solDetalhe.data_volta ? formatarData(solDetalhe.data_volta) : '—' }}</p></div>
              <div><span class="text-gray-500 text-xs">Serviços</span><p class="font-medium">{{ solDetalhe.tipo_servico }}</p></div>
              <div class="md:col-span-2"><span class="text-gray-500 text-xs">Motivo</span><p class="font-medium">{{ solDetalhe.motivo_viagem }}</p></div>
            </div>

            <!-- Preferências por serviço -->
            <div class="mt-5 space-y-3">
              <template v-if="temServico(solDetalhe, 'Aereo')">
                <div class="bg-sky-50 rounded-lg p-3 text-sm">
                  <p class="font-semibold text-sky-700 mb-1">✈ Preferências Aéreo</p>
                  <div class="grid grid-cols-2 md:grid-cols-3 gap-2 text-xs text-gray-600">
                    <span><strong>Período:</strong> {{ solDetalhe.aereo_periodo_preferido || '—' }}</span>
                    <span><strong>Trecho:</strong> {{ solDetalhe.aereo_tipo_trecho || '—' }}</span>
                    <span><strong>Bagagem extra:</strong> {{ solDetalhe.bagagem_extra ? 'Sim' : 'Não' }}</span>
                    <span v-if="solDetalhe.assento_especial"><strong>Assento:</strong> {{ solDetalhe.assento_especial }}</span>
                    <span v-if="solDetalhe.preferencia_voo"><strong>Voo Ida Pref.:</strong> {{ solDetalhe.preferencia_voo }}</span>
                    <span v-if="solDetalhe.preferencia_voo_volta"><strong>Voo Volta Pref.:</strong> {{ solDetalhe.preferencia_voo_volta }}</span>
                  </div>
                </div>
              </template>
              <template v-if="temServico(solDetalhe, 'Hospedagem')">
                <div class="bg-purple-50 rounded-lg p-3 text-sm">
                  <p class="font-semibold text-purple-700 mb-1">🏨 Preferências Hospedagem</p>
                  <div class="grid grid-cols-2 gap-2 text-xs text-gray-600">
                    <span><strong>Hotel preferido:</strong> {{ solDetalhe.preferencia_hotel_nome || '—' }}</span>
                    <span><strong>Quarto especial:</strong> {{ solDetalhe.quarto_excecao_saude ? 'Sim' : 'Não' }}</span>
                  </div>
                </div>
              </template>
              <template v-if="temServico(solDetalhe, 'Rodoviario')">
                <div class="bg-amber-50 rounded-lg p-3 text-sm">
                  <p class="font-semibold text-amber-700 mb-1">🚌 Preferências Rodoviário</p>
                  <div class="grid grid-cols-2 gap-2 text-xs text-gray-600">
                    <span><strong>Período:</strong> {{ solDetalhe.rodov_periodo_preferido || '—' }}</span>
                    <span><strong>Tipo ônibus:</strong> {{ solDetalhe.rodov_tipo_onibus || '—' }}</span>
                  </div>
                </div>
              </template>
              <template v-if="temServico(solDetalhe, 'Carro')">
                <div class="bg-green-50 rounded-lg p-3 text-sm">
                  <p class="font-semibold text-green-700 mb-1">🚗 Preferências Carro</p>
                  <div class="grid grid-cols-2 md:grid-cols-3 gap-2 text-xs text-gray-600">
                    <span><strong>Retirada:</strong> {{ solDetalhe.carro_cidade_retirada || '—' }} {{ solDetalhe.carro_hora_retirada }}</span>
                    <span><strong>Devolução:</strong> {{ solDetalhe.carro_cidade_devolucao || '—' }} {{ solDetalhe.carro_hora_devolucao }}</span>
                  </div>
                </div>
              </template>
            </div>

            <!-- Observações -->
            <div v-if="solDetalhe.observacoes_viajante" class="mt-3 text-xs text-gray-500 italic">
              <strong>Obs.:</strong> {{ solDetalhe.observacoes_viajante }}
            </div>

            <!-- Casamentos -->
            <div v-if="solDetalhe.casamentos && solDetalhe.casamentos.length" class="mt-5">
              <p class="text-sm font-semibold text-gray-700 mb-2">🔗 Casamentos detectados pelo motor</p>
              <div class="overflow-x-auto">
                <table class="text-xs w-full border-collapse">
                  <thead>
                    <tr class="bg-gray-100 text-gray-600">
                      <th class="px-3 py-2 text-left rounded-tl">Protocolo par</th>
                      <th class="px-3 py-2 text-left">Tipo</th>
                      <th class="px-3 py-2 text-left">Destino</th>
                      <th class="px-3 py-2 text-left rounded-tr">Serviços em comum</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr v-for="c in solDetalhe.casamentos" :key="c.par_id"
                      class="border-t border-gray-100 hover:bg-gray-50 cursor-pointer"
                      @click="abrirDetalhe(c.par_id)">
                      <td class="px-3 py-2 text-blue-600 font-mono">#{{ c.par_id }}</td>
                      <td class="px-3 py-2">
                        <span :class="badgeCasamento(c.tipo_match)" class="rounded-full px-2 py-0.5 font-semibold">{{ c.tipo_match }}</span>
                      </td>
                      <td class="px-3 py-2">{{ c.destino }}</td>
                      <td class="px-3 py-2">{{ c.servicos_comuns || '—' }}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- ─── FORMULÁRIO DE COTAÇÃO ─── -->
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-1">
              {{ solDetalhe.cotacao ? '✏ Atualizar Cotação' : '💰 Registrar Cotação' }}
            </h2>
            <p class="text-xs text-gray-500 mb-5">Preencha apenas os campos referentes aos serviços solicitados.</p>

            <div v-if="cotacaoSucesso" class="mb-4 bg-green-50 border border-green-200 text-green-700 rounded-lg px-4 py-3 text-sm">
              ✔ Cotação registrada com sucesso!
            </div>
            <div v-if="cotacaoErro" class="mb-4 bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm">
              {{ cotacaoErro }}
            </div>

            <form @submit.prevent="enviarCotacao" class="space-y-6">

              <!-- Aéreo -->
              <div v-if="temServico(solDetalhe, 'Aereo')" class="border border-sky-200 rounded-xl p-4 bg-sky-50">
                <p class="font-semibold text-sky-700 text-sm mb-3">✈ Passagem Aérea</p>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                  <div>
                    <label class="text-xs text-gray-600 font-medium">Companhia Aérea</label>
                    <input v-model="formCotacao.aereo_companhia" type="text" placeholder="Ex: LATAM"
                      class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400" />
                  </div>
                  <div>
                    <label class="text-xs text-gray-600 font-medium">Número do Voo</label>
                    <input v-model="formCotacao.aereo_numero_voo" type="text" placeholder="Ex: LA3001"
                      class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400" />
                  </div>
                  <div>
                    <label class="text-xs text-gray-600 font-medium">Horário de Ida</label>
                    <input v-model="formCotacao.aereo_horario_ida" type="text" placeholder="06:00 → 08:30"
                      class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400" />
                  </div>
                  <div>
                    <label class="text-xs text-gray-600 font-medium">Horário de Volta</label>
                    <input v-model="formCotacao.aereo_horario_volta" type="text" placeholder="19:00 → 21:30"
                      class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400" />
                  </div>
                  <div>
                    <label class="text-xs text-gray-600 font-medium">Valor Total (R$)</label>
                    <input v-model.number="formCotacao.aereo_valor" type="number" min="0" step="0.01" placeholder="0,00"
                      class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400" />
                  </div>
                </div>
              </div>

              <!-- Hospedagem -->
              <div v-if="temServico(solDetalhe, 'Hospedagem')" class="border border-purple-200 rounded-xl p-4 bg-purple-50">
                <p class="font-semibold text-purple-700 text-sm mb-3">🏨 Hospedagem</p>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                  <div>
                    <label class="text-xs text-gray-600 font-medium">Nome do Hotel</label>
                    <input v-model="formCotacao.hotel_nome" type="text" placeholder="Hotel Grand Hyatt"
                      class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400" />
                  </div>
                  <div>
                    <label class="text-xs text-gray-600 font-medium">Padrão da Categoria</label>
                    <input v-model="formCotacao.hotel_categoria" type="text" placeholder="Ex: Superior, Executive, Standard…"
                      class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400" />
                  </div>
                  <div>
                    <label class="text-xs text-gray-600 font-medium">Valor da Diária (R$)</label>
                    <input v-model.number="formCotacao.hotel_valor_diaria" type="number" min="0" step="0.01" placeholder="0,00"
                      class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400" />
                  </div>
                </div>
              </div>

              <!-- Rodoviário -->
              <div v-if="temServico(solDetalhe, 'Rodoviario')" class="border border-amber-200 rounded-xl p-4 bg-amber-50">
                <p class="font-semibold text-amber-700 text-sm mb-3">🚌 Transporte Rodoviário</p>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                  <div>
                    <label class="text-xs text-gray-600 font-medium">Empresa</label>
                    <input v-model="formCotacao.rodov_empresa" type="text" placeholder="Ex: Cometa"
                      class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400" />
                  </div>
                  <div>
                    <label class="text-xs text-gray-600 font-medium">Horário de Ida</label>
                    <input v-model="formCotacao.rodov_horario_ida" type="text" placeholder="07:30"
                      class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400" />
                  </div>
                  <div>
                    <label class="text-xs text-gray-600 font-medium">Horário de Volta</label>
                    <input v-model="formCotacao.rodov_horario_volta" type="text" placeholder="18:00"
                      class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400" />
                  </div>
                  <div>
                    <label class="text-xs text-gray-600 font-medium">Valor (R$)</label>
                    <input v-model.number="formCotacao.rodov_valor" type="number" min="0" step="0.01" placeholder="0,00"
                      class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400" />
                  </div>
                </div>
              </div>

              <!-- Carro -->
              <div v-if="temServico(solDetalhe, 'Carro')" class="border border-green-200 rounded-xl p-4 bg-green-50">
                <p class="font-semibold text-green-700 text-sm mb-3">🚗 Locação de Carro</p>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                  <div>
                    <label class="text-xs text-gray-600 font-medium">Locadora</label>
                    <input v-model="formCotacao.carro_locadora" type="text" placeholder="Localiza / Hertz"
                      class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-400" />
                  </div>
                  <div>
                    <label class="text-xs text-gray-600 font-medium">Modelo</label>
                    <input v-model="formCotacao.carro_modelo" type="text" placeholder="HB20 ou similar"
                      class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-400" />
                  </div>
                  <div>
                    <label class="text-xs text-gray-600 font-medium">Valor da Diária (R$)</label>
                    <input v-model.number="formCotacao.carro_valor_diaria" type="number" min="0" step="0.01" placeholder="0,00"
                      class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-400" />
                  </div>
                </div>
              </div>

              <!-- Total e Observações -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="text-xs text-gray-600 font-medium">Valor Total da Cotação (R$)</label>
                  <input v-model.number="formCotacao.valor_total" type="number" min="0" step="0.01" placeholder="0,00"
                    class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
                </div>
                <div>
                  <label class="text-xs text-gray-600 font-medium">Observações</label>
                  <textarea v-model="formCotacao.observacoes" rows="2" placeholder="Informações adicionais…"
                    class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none"></textarea>
                </div>
              </div>

              <div class="flex justify-end gap-3 pt-2">
                <button type="button" @click="voltarLista"
                  class="px-5 py-2.5 text-sm border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50 transition">
                  Cancelar
                </button>
                <button type="submit" :disabled="enviandoCotacao"
                  class="px-6 py-2.5 text-sm bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-semibold rounded-lg transition">
                  {{ enviandoCotacao ? 'Enviando…' : (solDetalhe.cotacao ? 'Atualizar Cotação' : 'Enviar Cotação') }}
                </button>
              </div>
            </form>
          </div>

          <!-- ─── UPLOAD DE VOUCHERS (apenas agência vencedora) ─── -->
          <div v-if="solDetalhe.status === 'APROVADA_AGUARDANDO_VOUCHER' && solDetalhe.agencia_vencedora === agenciaNome"
            class="bg-white rounded-xl shadow-sm border border-purple-200 p-6 mt-6">
            <h2 class="text-lg font-bold text-purple-800 mb-1">🎫 Emitir Vouchers</h2>
            <p class="text-xs text-gray-500 mb-5">
              Envie um voucher (PDF, JPG ou PNG, máx. 20 MB) para cada serviço contratado.
            </p>

            <div v-if="voucherSucesso" class="mb-4 bg-green-50 border border-green-200 text-green-700 rounded-lg px-4 py-3 text-sm">
              ✔ {{ voucherSucesso }}
            </div>
            <div v-if="voucherErro" class="mb-4 bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm">
              {{ voucherErro }}
            </div>

            <div class="space-y-4">
              <div v-for="tipo in tiposVoucherNecessarios(solDetalhe)" :key="tipo.valor"
                class="flex items-center gap-4 border border-gray-200 rounded-lg p-4">
                <span class="text-2xl">{{ tipo.icone }}</span>
                <div class="flex-1">
                  <p class="text-sm font-semibold text-gray-700">{{ tipo.label }}</p>
                  <p class="text-xs text-gray-400 mt-0.5">
                    {{ arquivosVoucher[tipo.valor] ? arquivosVoucher[tipo.valor].name : 'Nenhum arquivo selecionado' }}
                  </p>
                </div>
                <label class="cursor-pointer">
                  <span class="px-4 py-2 text-sm bg-purple-50 text-purple-700 border border-purple-300 rounded-lg hover:bg-purple-100 transition">
                    Selecionar
                  </span>
                  <input type="file" class="hidden" accept=".pdf,.jpg,.jpeg,.png"
                    @change="selecionarArquivoVoucher($event, tipo.valor)" />
                </label>
                <button @click="uploadVoucher(tipo.valor)"
                  :disabled="!arquivosVoucher[tipo.valor] || enviandoVoucher[tipo.valor]"
                  class="px-4 py-2 text-sm bg-purple-600 hover:bg-purple-700 disabled:opacity-40 text-white rounded-lg transition">
                  {{ enviandoVoucher[tipo.valor] ? 'Enviando…' : 'Enviar' }}
                </button>
              </div>
            </div>

            <p class="mt-4 text-xs text-gray-400">
              Após o envio de todos os vouchers, a solicitação será automaticamente concluída.
            </p>
          </div>

      </div><!-- /wrapper card -->
    </main>
  </div>
</div>

<script>
const { createApp, ref, reactive, computed, onMounted } = Vue;

createApp({
  setup() {
    const API = '/api/v1';

    // ── Estado global ──────────────────────────────────────────────
    const tela          = ref('token_carregando');
    const nomeUsuario   = ref('');
    const agenciaNome   = ref('');
    const token         = ref('');

    // Modo token (acesso via link de e-mail — sem login)
    const modoToken     = ref(true);
    const tokenUUID     = ref('');
    const tokenErro     = ref('');
    const tokenFinalidade = ref('COTACAO');  // COTACAO / VOUCHER

    // Lista
    const solicitacoes    = ref([]);
    const carregandoLista = ref(false);
    const filtroStatus    = ref('');

    // Detalhe
    const solDetalhe      = ref(null);

    // Cotação
    const formCotacao = reactive({
      aereo_companhia: '', aereo_numero_voo: '', aereo_horario_ida: '', aereo_horario_volta: '', aereo_valor: null,
      hotel_nome: '', hotel_categoria: '', hotel_valor_diaria: null,
      rodov_empresa: '', rodov_horario_ida: '', rodov_horario_volta: '', rodov_valor: null,
      carro_locadora: '', carro_modelo: '', carro_valor_diaria: null,
      valor_total: null, observacoes: '',
    });
    const enviandoCotacao = ref(false);
    const cotacaoSucesso  = ref(false);
    const cotacaoErro     = ref('');

    // ── Helpers ────────────────────────────────────────────────────
    function authHeaders() {
      return { Authorization: `Bearer ${token.value}`, 'Content-Type': 'application/json' };
    }

    function temServico(sol, servico) {
      return (sol?.tipo_servico || '').split(',').map(s => s.trim()).includes(servico);
    }

    function formatarData(dt) {
      if (!dt) return '—';
      return new Date(dt).toLocaleDateString('pt-BR');
    }

    function formatarMoeda(val) {
      if (val == null) return '—';
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
    }

    function badgeStatus(s) {
      const m = {
        AGUARDANDO_COTACAO:          'bg-yellow-100 text-yellow-800',
        COTACAO_ENVIADA:             'bg-blue-100 text-blue-800',
        APROVADA_AGUARDANDO_VOUCHER: 'bg-purple-100 text-purple-800',
        CONCLUIDA:                   'bg-green-100 text-green-800',
        REPROVADA:                   'bg-red-100 text-red-700',
      };
      return m[s] || 'bg-gray-100 text-gray-600';
    }

    function labelStatus(s) {
      const m = {
        AGUARDANDO_COTACAO:          'Aguardando Cotação',
        COTACAO_ENVIADA:             'Cotação Enviada',
        APROVADA_AGUARDANDO_VOUCHER: '🎫 Aguardando Vouchers',
        CONCLUIDA:                   'Concluída',
        AGUARDANDO_N1:               'Aguardando N1',
        AGUARDANDO_N2:               'Aguardando N2',
        REPROVADA:                   'Reprovada',
      };
      return m[s] || s;
    }

    function badgeCasamento(tipo) {
      const m = {
        TOTAL:     'bg-green-100 text-green-800',
        PARCIAL_A: 'bg-blue-100 text-blue-800',
        PARCIAL_B: 'bg-yellow-100 text-yellow-800',
      };
      return m[tipo] || 'bg-gray-100 text-gray-600';
    }

    function popularFormCotacao(cotacao) {
      if (!cotacao) return;
      Object.keys(formCotacao).forEach(k => {
        if (cotacao[k] !== undefined) formCotacao[k] = cotacao[k];
      });
    }

    // ── Autenticação ───────────────────────────────────────────────
    async function carregarPorToken(uuid) {
      tela.value = 'token_carregando';
      try {
        const res = await fetch(`${API}/agencia/token/${uuid}`);
        const dados = await res.json();
        if (!res.ok) {
          tokenErro.value = dados.detail || 'Link inválido ou expirado.';
          tela.value = 'token_erro';
          return;
        }
        agenciaNome.value    = dados.agencia_nome;
        tokenFinalidade.value = dados.finalidade_token;
        solDetalhe.value     = dados.solicitacao;
        tela.value = 'detalhe';
      } catch (e) {
        tokenErro.value = 'Erro de conexão. Tente novamente mais tarde.';
        tela.value = 'token_erro';
      }
    }

    // ── Solicitações ───────────────────────────────────────────────
    async function carregarSolicitacoes() {
      carregandoLista.value = true;
      try {
        const qs  = filtroStatus.value ? `?status_filtro=${filtroStatus.value}` : '';
        const res = await fetch(`${API}/agencia/solicitacoes${qs}`, { headers: authHeaders() });
        if (res.status === 401) { sair(); return; }
        solicitacoes.value = await res.json();
      } catch (e) {
        console.error('Erro ao carregar solicitações', e);
      } finally {
        carregandoLista.value = false;
      }
    }

    async function abrirDetalhe(id) {
      solDetalhe.value  = null;
      cotacaoSucesso.value = false;
      cotacaoErro.value    = '';
      tela.value = 'detalhe';
      try {
        const res = await fetch(`${API}/agencia/solicitacoes/${id}`, { headers: authHeaders() });
        if (res.status === 401) { sair(); return; }
        const dados = await res.json();
        if (!res.ok) {
          alert(dados.detail || 'Erro ao carregar detalhe.');
          voltarLista();
          return;
        }
        solDetalhe.value = dados;
        // Limpar form
        Object.keys(formCotacao).forEach(k => { formCotacao[k] = null; });
        formCotacao.observacoes = '';
        // Pré-popular com cotação existente
        if (dados.cotacao) popularFormCotacao(dados.cotacao);
        // Auto-completar com preferências do viajante (editável)
        if (!dados.cotacao) {
          if (dados.aereo_periodo_preferido) formCotacao.aereo_horario_ida = dados.aereo_periodo_preferido;
          if (dados.preferencia_voo)         formCotacao.aereo_numero_voo  = dados.preferencia_voo;
          if (dados.preferencia_hotel_nome)  formCotacao.hotel_nome         = dados.preferencia_hotel_nome;
          if (dados.rodov_tipo_onibus)        formCotacao.rodov_empresa      = dados.rodov_tipo_onibus;
        }
      } catch (e) {
        console.error(e);
      }
    }

    function voltarLista() {
      tela.value = 'lista';
      solDetalhe.value = null;
      carregarSolicitacoes();
    }

    // ── Cotação ────────────────────────────────────────────────────
    async function enviarCotacao() {
      if (!solDetalhe.value) return;
      enviandoCotacao.value = true;
      cotacaoSucesso.value  = false;
      cotacaoErro.value     = '';
      try {
        const url = modoToken.value
          ? `${API}/agencia/token/${tokenUUID.value}/cotacao`
          : `${API}/agencia/solicitacoes/${solDetalhe.value.id}/cotacao`;
        const headers = modoToken.value
          ? { 'Content-Type': 'application/json' }
          : authHeaders();
        const res = await fetch(url, {
          method: 'POST',
          headers,
          body: JSON.stringify(formCotacao),
        });
        const dados = await res.json();
        if (!res.ok) {
          cotacaoErro.value = dados.detail || 'Erro ao registrar cotação.';
          return;
        }
        cotacaoSucesso.value = true;
        solDetalhe.value.cotacao = dados;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (e) {
        cotacaoErro.value = 'Erro de conexão com o servidor.';
      } finally {
        enviandoCotacao.value = false;
      }
    }

    // ── Vouchers ───────────────────────────────────────────────────
    const arquivosVoucher  = reactive({});
    const enviandoVoucher  = reactive({});
    const voucherSucesso   = ref('');
    const voucherErro      = ref('');

    const _tiposInfo = {
      aereo:       { label: 'Passagem Aérea',    icone: '✈' },
      hospedagem:  { label: 'Hospedagem',        icone: '🏨' },
      carro:       { label: 'Locação de Carro',  icone: '🚗' },
      rodoviario:  { label: 'Transporte Rodoviário', icone: '🚌' },
    };
    const _mapServico = { Aereo: 'aereo', Hospedagem: 'hospedagem', Carro: 'carro', Rodoviario: 'rodoviario' };

    function tiposVoucherNecessarios(sol) {
      return (sol?.tipo_servico || '').split(',')
        .map(s => s.trim())
        .filter(s => _mapServico[s])
        .map(s => ({ valor: _mapServico[s], ..._tiposInfo[_mapServico[s]] }));
    }

    function selecionarArquivoVoucher(event, tipo) {
      arquivosVoucher[tipo] = event.target.files[0] || null;
    }

    async function uploadVoucher(tipo) {
      const arquivo = arquivosVoucher[tipo];
      if (!arquivo || !solDetalhe.value) return;
      enviandoVoucher[tipo] = true;
      voucherSucesso.value  = '';
      voucherErro.value     = '';
      try {
        const fd = new FormData();
        fd.append('tipo_voucher', tipo);
        fd.append('arquivo', arquivo);
        const url = modoToken.value
          ? `${API}/agencia/token/${tokenUUID.value}/voucher`
          : `${API}/vouchers/${solDetalhe.value.id}/upload`;
        const headers = modoToken.value ? {} : { Authorization: `Bearer ${token.value}` };
        const res = await fetch(url, { method: 'POST', headers, body: fd });
        const dados = await res.json();
        if (!res.ok) {
          voucherErro.value = dados.detail || 'Erro ao enviar voucher.';
          return;
        }
        voucherSucesso.value = `Voucher "${_tiposInfo[tipo]?.label}" enviado com sucesso!`;
        arquivosVoucher[tipo] = null;
        if (dados.status_solicitacao === 'CONCLUIDA') {
          solDetalhe.value.status = 'CONCLUIDA';
          voucherSucesso.value = '🎉 Todos os vouchers enviados! Solicitação CONCLUÍDA.';
        }
      } catch (e) {
        voucherErro.value = 'Erro de conexão com o servidor.';
      } finally {
        enviandoVoucher[tipo] = false;
      }
    }

    function sair() {
      token.value = '';
      tela.value = 'token_erro';
      tokenErro.value = 'Sessão expirada ou link inválido.';
    }

    onMounted(() => {
      const params = new URLSearchParams(window.location.search);
      const tokenParam = params.get('token');
      if (tokenParam) {
        modoToken.value  = true;
        tokenUUID.value  = tokenParam;
        carregarPorToken(tokenParam);
      } else {
        tokenErro.value = 'Este portal requer um link de cotação válido enviado por e-mail.';
        tela.value = 'token_erro';
      }
    });

    return {
      tela, nomeUsuario, agenciaNome,
      modoToken, tokenErro,
      solicitacoes, carregandoLista, filtroStatus, carregarSolicitacoes,
      solDetalhe, abrirDetalhe, voltarLista, sair,
      formCotacao, enviandoCotacao, cotacaoSucesso, cotacaoErro, enviarCotacao,
      arquivosVoucher, enviandoVoucher, voucherSucesso, voucherErro,
      tiposVoucherNecessarios, selecionarArquivoVoucher, uploadVoucher,
      temServico, formatarData, formatarMoeda, badgeStatus, labelStatus, badgeCasamento,
    };
  }
}).mount('#app');
</script>
</body>
</html>
